<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truck Test 2.0 · coleta e apresentação</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F7;--paper:#fff;--ink:#0d0f12;--ink2:#3c4450;--ink3:#79828f;--line:#dfe3e8;--soft:#f2f4f6;--mb:#111318;--acc:#B8432F;--teal:#00A19B;--good:#1e7b4f;--bad:#b3261e;--warn:#b7791f;--info:#3B6EA5}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,'Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:250px 1fr;height:100%;min-height:0}
aside{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .top{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
aside h1{font-size:14px;font-weight:800;margin:0;letter-spacing:-.01em}aside h1 small{display:block;font-size:10.5px;font-weight:500;color:var(--ink3);margin-top:2px}
.tests{flex:1;overflow:auto;padding:8px}
.test{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit;color:var(--ink)}
.test.on{border-color:var(--mb);background:var(--soft)}.test b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.test span{font-size:10.5px;color:var(--ink3)}
.side-actions{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
main{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .name{font-size:15px;font-weight:800;border:0;background:transparent;font-family:inherit;min-width:260px;flex:1;padding:4px 0;outline:none;border-bottom:1px dashed transparent}.bar .name:focus{border-bottom-color:var(--acc)}
.btn{font:600 11.5px/1 Inter,system-ui,sans-serif;letter-spacing:.04em;padding:9px 13px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mb);color:var(--ink)}.btn.pri{background:var(--mb);color:#fff;border-color:var(--mb)}.btn.pri:hover{background:#2a2e35}.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.sm{padding:5px 8px;font-size:10.5px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;gap:2px;padding:0 18px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:600 11.5px/1 Inter,system-ui,sans-serif;padding:11px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}.tab i{font-style:normal;font-family:Consolas,monospace;font-size:10px;color:var(--ink3);margin-right:5px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}.tab .dot.ok{background:var(--good)}
.body{flex:1;overflow:auto;padding:18px;display:grid;grid-template-columns:1fr 300px;gap:16px;align-content:start}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{display:none}.body{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.card h2 small{font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}.f.w2{grid-column:span 2}.f.w3{grid-column:1/-1}
.f label{font-size:10.5px;font-weight:700;color:var(--ink2)}.f label small{font-weight:500;color:var(--ink3)}
.f input,.f select,.f textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}.f textarea{min-height:68px;resize:vertical}
.f .u{position:relative}.f .u input{padding-right:52px}.f .u span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink3);pointer-events:none}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:6px 0}.chk input{width:15px;height:15px;accent-color:var(--mb)}
table{border-collapse:collapse;width:100%;font-size:12px}th{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 4px;border-bottom:1px solid var(--soft);vertical-align:middle}td input,td select{font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;width:100%;min-width:60px;background:var(--paper)}
td input:focus,td select:focus{border-color:var(--acc);outline:none}
.tw{overflow-x:auto}
.side .card{position:sticky;top:0}
.kp{border:1px solid var(--line);border-left:3px solid var(--mb);border-radius:6px;padding:8px 10px;margin-bottom:8px}.kp .l{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.kp .v{font-size:20px;font-weight:800;letter-spacing:-.02em}.kp .v small{font-size:11px;color:var(--ink3);font-weight:600}.kp .d{font-size:10.5px;color:var(--ink2)}

.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 10px}.meter i{display:block;height:100%;background:var(--good)}
.hint{font-size:11px;color:var(--ink3);margin:6px 0 0;line-height:1.45}
.co{background:var(--soft);border-left:3px solid var(--mb);border-radius:0 6px 6px 0;padding:8px 11px;font-size:12px;color:var(--ink2);margin:8px 0}.co.w{border-left-color:var(--warn)}.co.g{border-left-color:var(--good)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.ph{border:1px solid var(--line);border-radius:6px;overflow:hidden}.ph img{width:100%;height:110px;object-fit:cover;display:block;background:var(--soft)}.ph .m{padding:6px}.ph input,.ph select{font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:100%;margin-bottom:4px}
.logo-prev{height:56px;max-width:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff;display:block;margin-top:6px}
.score td:first-child{font-weight:600}.score select{min-width:70px}
.compat select{min-width:120px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--mb);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}.toast.on{opacity:1}
.out{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.out a{font-size:12px;color:var(--info);font-weight:600}

</head>
<body>

 <aside>

</div>
<div class="toast" id="toast"></div>

   { t: 'Mercedes-Benz · operação e valor no tempo', f: [F('tco.arlaMB', 'ARLA', { u: '% do diesel', n: 1 }), F('tco.manutMB', 'Manutenção (plano)', { u: 'R$/km', n: 1 }), F('tco.pneusMB', 'Pneus', { u: 'R$/km', n: 1 }), F('tco.dispMB', 'Disponibilidade', { u: '%', n: 1 }), F('tco.deprecMB', 'Depreciação', { u: '% a.a.', n: 1 }), F('tco.residualMB', 'Residual informado', { u: '% do preço', n: 1 }), F('tco.ipva', 'IPVA', { u: '% a.a.', n: 1 }), F('tco.segPct', 'Seguro', { u: '% a.a.', n: 1 })], hint: 'O consumo do Mercedes-Benz vem do teste (trechos ou bomba); o do veículo atual, do Baseline.' },
   { t: 'Referência · financiamento', f: [F('tco.entradaC', 'Entrada', { u: '%', n: 1 }), F('tco.prazoC', 'Prazo', { u: 'meses', n: 1 }), F('tco.taxaC', 'Taxa', { u: 'mesma unidade', n: 1, hint: 'vazio = mesma taxa do MB' }), F('tco.carenciaC', 'Carência', { u: 'meses', n: 1 }), F('tco.dispC', 'Disponibilidade', { u: '%', n: 1, hint: 'vazio = a do baseline' }), F('tco.ipvaC', 'IPVA', { u: '% a.a.', n: 1 }), F('tco.segPctC', 'Seguro', { u: '% a.a.', n: 1 })] },
   { t: 'Globais', f: [F('tco.horiz', 'Horizonte', { u: 'meses', n: 1 }), F('tco.infDiesel', 'Inflação do diesel', { u: '% a.a.', n: 1 }), F('tco.receita', 'Receita por caminhão', { u: 'R$/mês', n: 1 }), F('tco.margem', 'Margem de contribuição', { u: '%', n: 1 }), F('tco.desagio', 'Deságio na revenda', { u: '%', n: 1 }), F('tco.custoVenda', 'Custos de venda', { u: '%', n: 1 })] },
   { t: 'Resultado', tcoout: 1 }] },
  { id: 'prop', l: 'Proposta', cards: [
   { t: 'Condição comercial', f: [F('prop.lote', 'Lote', { u: 'un', n: 1 }), F('prop.modelo', 'Modelo'), F('prop.preco', 'Preço por unidade'), F('prop.condicao', 'Financiamento', { hint: 'ex.: 1,17% a.m. · 60 m · 3 de carência · sem entrada' }), F('prop.validade', 'Validade'), F('prop.janela', 'Janela de compra'), F('prop.inclui', 'O que está incluído', { ta: 1, w: 3, hint: 'plano de manutenção, telemetria, treinamento, garantia…' })] },
   { t: 'Decisão e próximos passos', f: [F('prop.decisao', 'Decisão proposta (uma frase)', { ta: 1, w: 3 }), F('prop.criterio', 'Critério de sucesso do piloto', { ta: 1, w: 3 }), F('prop.passos', 'Próximos passos (até 3, um por linha: ação · responsável · data)', { ta: 1, w: 3 })] }] },
  { id: 'fotos', l: 'Fotos', cards: [{ t: 'Fotografias reais do teste', fotos: 1 }] },
 ];
 /* ---------- render ---------- */
 function renderTests() {
  const el = document.getElementById('tests');
  el.innerHTML = S.tests.length ? S.tests.map(t => `<button class="test ${t.id === S.cur ? 'on' : ''}" onclick="app.abrir('${t.id}')"><b>${esc(t.nome || t.cli.empresa || 'Sem nome')}</b><span>${esc(t.cli.empresa || '—')} · ${new Date(t.atualizadoEm).toLocaleDateString('pt-BR')}</span></button>`).join('') : '<p class="hint" style="padding:8px">Nenhum teste. Crie um novo ou importe um JSON.</p>';
 }
 function tabs() {
  const t = T(); if (!t) return;
  document.getElementById('tabs').innerHTML = SEC.map((s, i) => `<button class="tab ${i === tab ? 'on' : ''}" onclick="app.tab(${i})"><i>${String(i + 1).padStart(2, '0')}</i>${s.l}</button>`).join('');
 }
 function field(f, t) {
  const v = get(t, f.k) ?? '';
  const cls = 'f' + (f.w === 2 ? ' w2' : f.w === 3 ? ' w3' : '');
  const oi = `oninput="app.set('${f.k}',this.value)"`;
  let inp;
  if (f.sel) inp = `<select onchange="app.set('${f.k}',this.value)">${f.sel.map(([a, b]) => `<option value="${a}" ${String(v) === a ? 'selected' : ''}>${b}</option>`).join('')}</select>`;
  else if (f.ta) inp = `<textarea ${oi}>${esc(v)}</textarea>`;
  else if (f.u) inp = `<div class="u"><input type="text" inputmode="decimal" value="${esc(v)}" ${oi}><span>${f.u}</span></div>`;
  else inp = `<input type="${f.type || 'text'}" value="${esc(v)}" ${oi}>`;
  return `<div class="${cls}"><label>${f.l}${f.hint ? ` <small>· ${f.hint}</small>` : ''}</label>${inp}</div>`;
 }
 function table(card, t) {
  const rows = t[card.tbl] || [];
  const cell = (r, i, c) => { const [k, , ty, opts] = c, v = r[k] ?? '', oc = `oninput="app.row('${card.tbl}',${i},'${k}',this.value)"`;
   if (ty === 'sel') return `<select onchange="app.row('${card.tbl}',${i},'${k}',this.value)"><option value=""></option>${opts.map(([a, b]) => `<option value="${a}" ${v === a ? 'selected' : ''}>${b}</option>`).join('')}</select>`;
   return `<input type="${ty === 'date' ? 'date' : 'text'}" ${ty === 'n' ? 'inputmode="decimal"' : ''} value="${esc(v)}" ${oc}>`; };
  return `<div class="tw"><table><thead><tr>${card.cols.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r, i) => `<tr>${card.cols.map(c => `<td>${cell(r, i, c)}</td>`).join('')}<td><button class="btn sm danger" onclick="app.delRow('${card.tbl}',${i})">×</button></td></tr>`).join('')}</tbody></table></div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" onclick="app.addRow('${card.tbl}')">+ linha</button>${card.tbl === 'trechos' ? `<button class="btn sm" onclick="app.dupRow('trechos')">duplicar última</button>` : ''}</div>${card.hint ? `<p class="hint">${card.hint}</p>` : ''}`;
 }
 function scoreTable(t) {
  const sc = t.drv.scores || {};
  return `<div class="tw"><table class="score"><thead><tr><th>Critério</th><th>Peso</th><th>Veículo atual</th><th>Mercedes-Benz</th><th>Δ</th></tr></thead><tbody>${TT.DRV_CRIT.map(([k, l, w]) => { const a = sc[k]?.atual || '', m = sc[k]?.mb || ''; const opt = v => `<option value=""></option>` + [1, 2, 3, 4, 5].map(x => `<option ${String(v) === String(x) ? 'selected' : ''}>${x}</option>`).join(''); return `<tr><td>${l}</td><td>${w}</td><td><select onchange="app.set('drv.scores.${k}.atual',this.value)">${opt(a)}</select></td><td><select onchange="app.set('drv.scores.${k}.mb',this.value)">${opt(m)}</select></td><td>${a && m ? (m - a > 0 ? '+' : '') + (m - a) : ''}</td></tr>`; }).join('')}</tbody></table></div><p class="hint">Âncoras: 1 = ruim (cansa em 4 h, insegura carregado, perde velocidade em aclive) · 3 = adequado · 5 = excelente (chega descansado, confiante em serra, sobra torque).</p>`;
 }
 function compatTable(t) {
  return `<div class="tw"><table class="compat"><thead><tr><th>Item</th><th>Testado</th><th>Ofertado</th><th>Status</th><th>Impacto da diferença</th></tr></thead><tbody>${R.compat.map(c => `<tr><td><b>${c.l}</b></td><td>${esc(c.a) || '<span style="color:var(--bad)">—</span>'}</td><td>${esc(c.b) || '<span style="color:var(--bad)">—</span>'}</td><td><select onchange="app.set('compat.${c.k}.status',this.value)"><option value="" ${!t.compat[c.k]?.status ? 'selected' : ''}>auto: ${c.st}</option>${[['identico', 'Idêntico'], ['equivalente', 'Tecnicamente equivalente'], ['diferente', 'Diferente']].map(([a, b]) => `<option value="${a}" ${t.compat[c.k]?.status === a ? 'selected' : ''}>${b}</option>`).join('')}</select></td><td><input value="${esc(t.compat[c.k]?.nota || '')}" oninput="app.set('compat.${c.k}.nota',this.value)" placeholder="ex.: +20 cv, efeito esperado em retomada"></td></tr>`).join('')}</tbody></table></div><p class="hint">Status automático compara os textos; ajuste para "equivalente" quando a diferença não muda o resultado e descreva o impacto quando for "diferente".</p>`;
 }
 function fotosCard(t) {
  return `<div class="photos">${t.fotos.map((f, i) => `<div class="ph"><img src="${f.src}"><div class="m"><select onchange="app.foto(${i},'tipo',this.value)">${[['capa', 'Capa'], ['veiculo', 'Veículo na operação'], ['carga', 'Carga / implemento'], ['cabine', 'Cabine / motorista'], ['odometro', 'Odômetro / cupom'], ['mapa', 'Mapa / rota']].map(([a, b]) => `<option value="${a}" ${f.tipo === a ? 'selected' : ''}>${b}</option>`).join('')}</select><input value="${esc(f.legenda || '')}" placeholder="legenda" oninput="app.foto(${i},'legenda',this.value)"><button class="btn sm danger" onclick="app.delFoto(${i})">remover</button></div></div>`).join('')}</div><div style="margin-top:10px"><button class="btn" onclick="document.getElementById('fotoFile').click()">+ Adicionar fotos</button><input type="file" id="fotoFile" accept="image/*" multiple hidden onchange="app.addFotos(this.files)"></div><p class="hint">As fotos são reduzidas a 1400 px e guardadas no navegador junto com o teste. A foto marcada como Capa abre a apresentação; a de tipo Mapa entra na página da rota.</p>`;
 }
 function tcoOut() {
  if (!R.tcoOk) return `<div class="co w">TCO pendente. ${R.gaps.filter(g => /TCO|Preço|Consumo|Quilometragem|diesel/.test(g.campo)).map(g => esc(g.campo)).join(' · ')}</div>`;
  const c = R.cen, f = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
  return `<div class="grid">${[['conservador', 'Conservador', 'g'], ['realista', 'Realista', 't'], ['otimista', 'Otimista', 'w']].map(([k, l, cl]) => `<div class="kp ${cl}"><div class="l">${l}</div><div class="v">${f(R.econAno[k])}<small> /ano</small></div><div class="d">${f(c[k].rm.tco)} × ${f(c[k].rc.tco)} em ${c[k].rm.H} m · consumo MB ${R.cenKml[k].toFixed(2)} km/L · payback ${c[k].payback ? 'mês ' + c[k].payback : 'imediato'}</div></div>`).join('')}</div><p class="hint">Metodologia do simulador de TCO da Tecar (mês a mês, financiamento por veículo, depreciação composta). Conservador: pior trecho carregado, atual +3%, diesel +10%, residual −5 p.p. Otimista: melhor trecho.</p>`;
 }
 function main() {
  const t = T(); const el = document.getElementById('main');
  if (!t) { el.innerHTML = '<div class="card"><p class="hint">Crie um novo Truck Test para começar.</p></div>'; document.getElementById('tabs').innerHTML = ''; document.getElementById('sidecard').innerHTML = ''; return; }
  R = TT.calc(t); document.getElementById('nome').value = t.nome || '';
  tabs();
  const s = SEC[tab];
  el.innerHTML = s.cards.map(c => `<div class="card"><h2>${c.t}${c.hint && c.f ? `<small>${c.hint}</small>` : ''}</h2>${c.f ? `<div class="grid">${c.f.map(f => field(f, t)).join('')}</div>` : ''}${c.chk ? c.chk.map(([k, l]) => `<label class="chk"><input type="checkbox" ${get(t, k) ? 'checked' : ''} onchange="app.set('${k}',this.checked)">${l}</label>`).join('') : ''}${c.tbl ? table(c, t) : ''}${c.score ? scoreTable(t) : ''}${c.compat ? compatTable(t) : ''}${c.fotos ? fotosCard(t) : ''}${c.tcoout ? tcoOut() : ''}${c.logo ? `<button class="btn" onclick="document.getElementById('logoFile').click()">Enviar logomarca</button> ${t.cli.logo ? '<button class="btn sm danger" onclick="app.set(\'cli.logo\',\'\');app.render()">remover</button>' : ''}<input type="file" id="logoFile" accept="image/*" hidden onchange="app.addLogo(this.files[0])">${t.cli.logo ? `<img class="logo-prev" src="${t.cli.logo}">` : '<p class="hint">PNG ou JPG; entra na capa da apresentação.</p>'}` : ''}</div>`).join('');
  side();
 }
 function side() {
  const t = T(); if (!t) return; R = TT.calc(t);
  const f2 = v => isFinite(v) ? v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—';
  const p0 = R.gaps.filter(g => g.p === 'P0');
  document.getElementById('sidecard').innerHTML = `<h2>Leitura ao vivo</h2><div class="meter"><i style="width:${R.completude}%"></i></div><p class="hint" style="margin:-4px 0 10px">Completude do protocolo: <b>${R.completude}%</b> · ${p0.length} pendências P0</p>
   <div class="kp t"><div class="l">Consumo MB</div><div class="v">${f2(R.kmlMB)}<small> km/L</small></div><div class="d">carregado ${f2(R.car.kml)} · vazio ${f2(R.vaz.kml)} · bomba ${f2(R.kmlBomba)}</div></div>
   <div class="kp"><div class="l">Frota atual</div><div class="v">${f2(R.kml0)}<small> km/L</small></div><div class="d">${isFinite(R.l100MenosCar) ? f2(R.l100MenosCar) + ' L a menos por 100 km carregado' : 'baseline pendente'}</div></div>
   <div class="kp a"><div class="l">Aderência da rota</div><div class="v">${isFinite(R.aderencia) ? Math.round(R.aderencia * 100) + '%' : '—'}</div><div class="d">RDI teste ${isFinite(R.rdiTeste) ? R.rdiTeste.toFixed(2) : '—'} × operação ${isFinite(R.rdiOp) ? R.rdiOp.toFixed(2) : '—'}</div></div>
   <div class="kp g"><div class="l">Economia · conservador</div><div class="v">${R.tcoOk ? 'R$ ' + Math.round(R.econAno.conservador).toLocaleString('pt-BR') : '—'}<small> /ano</small></div><div class="d">${R.tcoOk ? 'payback ' + (R.cen.conservador.payback ? 'mês ' + R.cen.conservador.payback : 'imediato') : 'TCO pendente'}</div></div>
   <h2 style="margin-top:14px">Data gap</h2><ul class="gapl">${R.gaps.slice(0, 12).map(g => `<li><span class="chip ${g.p}">${g.p}</span>${esc(g.campo)}</li>`).join('') || '<li>Nenhuma pendência.</li>'}</ul>`;
 }
 /* ---------- ações ---------- */
 const api = {
  render: main, set,
  tab(i) { tab = i; main(); },
  abrir(id) { S.cur = id; tab = 0; save(); renderTests(); main(); },
  novo() { const t = TT.NEW(); S.tests.unshift(t); S.cur = t.id; tab = 0; save(); renderTests(); main(); },
  duplicar() { const t = T(); if (!t) return; const c = JSON.parse(JSON.stringify(t)); c.id = TT.uid(); c.nome = (t.nome || 'Teste') + ' (cópia)'; c.criadoEm = c.atualizadoEm = new Date().toISOString(); S.tests.unshift(c); S.cur = c.id; save(); renderTests(); main(); },
  excluir() { const t = T(); if (!t) return; if (!confirm('Excluir "' + (t.nome || 'teste') + '"? Exporte o JSON antes se quiser guardar.')) return; if (t.id === EXEMPLO_ID) S.exemploRemovido = true; S.tests = S.tests.filter(x => x.id !== t.id); S.cur = S.tests[0]?.id || null; save(); renderTests(); main(); },
  row(tbl, i, k, v) { const t = T(); t[tbl][i][k] = v; set('atualizadoEm', new Date().toISOString()); },
  addRow(tbl) { const t = T(); t[tbl].push({}); save(); main(); },
  dupRow(tbl) { const t = T(); const l = t[tbl][t[tbl].length - 1]; t[tbl].push(l ? { ...l } : {}); save(); main(); },
  delRow(tbl, i) { const t = T(); t[tbl].splice(i, 1); save(); main(); },
  foto(i, k, v) { const t = T(); t.fotos[i][k] = v; save(); side(); },
  delFoto(i) { const t = T(); t.fotos.splice(i, 1); save(); main(); },
  async addFotos(files) { const t = T(); for (const f of files) { const src = await shrink(f, 1400, .82); t.fotos.push({ src, tipo: t.fotos.length ? 'veiculo' : 'capa', legenda: '' }); } save(); main(); },
  async addLogo(f) { if (!f) return; const t = T(); t.cli.logo = await shrink(f, 600, .9, true); save(); main(); },
  exportar() { const t = T(); if (!t) return; dl(new Blob([JSON.stringify(t, null, 1)], { type: 'application/json' }), slug(t) + '.json'); },
  importar() { const inp = document.getElementById('impFile'); inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { let txt = rd.result; if (/<html/i.test(txt)) { const m = txt.match(/<script type="application\/json" id="trucktest-data">([\s\S]*?)<\/script>/); if (!m) throw new Error('HTML sem dados'); txt = m[1].replace(/<\\\/script/g, '</script'); } const t = Object.assign(TT.NEW(), JSON.parse(txt)); if (S.tests.some(x => x.id === t.id)) t.id = TT.uid(); S.tests.unshift(t); S.cur = t.id; save(); renderTests(); main(); toast('Teste importado.'); } catch (e) { toast('Arquivo inválido: ' + e.message); } }; rd.readAsText(f); inp.value = ''; }; inp.click(); },
  exemplo(forcar) { if (!forcar && S.exemploRemovido) return; fetch('trucktest-exemplo.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(t => { if (!t) return; const i = S.tests.findIndex(x => x.id === t.id); if (i >= 0 && !forcar) return; if (i >= 0) S.tests.splice(i, 1); S.tests.push(t); S.exemploRemovido = false; if (forcar || !S.cur) { S.cur = t.id; tab = 0; } save(); renderTests(); main(); if (forcar) toast('Exemplo carregado: Transportadora Modelo · Actros 2653/S.'); }).catch(() => { if (forcar) toast('Não foi possível carregar trucktest-exemplo.json.'); }); },
  gerar() { const t = T(); if (!t) return; R = TT.calc(t); const html = TTREPORT.build(t, R); const blob = new Blob([html], { type: 'text/html' }); const url = URL.createObjectURL(blob); const w = window.open(url, '_blank'); dl(blob, slug(t) + ' - Truck Test 2.0.html'); toast(w ? 'Apresentação aberta em nova aba e salva como HTML.' : 'Pop-up bloqueado: o arquivo HTML foi baixado.'); }
 };
 const slug = t => (t.cli.empresa || t.nome || 'trucktest').replace(/[^\w\- ]+/g, '').trim();
 const dl = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); };
 const shrink = (file, max, q, png) => new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(png && file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q)); }; img.src = URL.createObjectURL(file); });
 renderTests(); main(); api.exemplo(false);
 return api;
})();
</script>
