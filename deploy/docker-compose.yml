# Torre Tecar no VPS: API + Postgres + atualização dos dados do repositório.
# Sistema independente: projeto, banco, volumes e redes próprios. Não publica portas no host;
# o tráfego chega pelo Caddy do RadarDispensa, que só enxerga a API pela rede "proxy_edge".
name: torre

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: torre
      POSTGRES_USER: torre
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no deploy/.env}"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      - torre_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torre -d torre"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    cpus: 0.5
    logging: *logs
    networks: [interno]

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: torre-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://torre:${POSTGRES_PASSWORD}@db:5432/torre"
      TORRE_SITE_ROOT: /srv/site
      TORRE_COOKIE_SECURE: "true"
      TORRE_PUBLIC_HOST_PREFIX: "simule."
      # OAuth do MCP somente leitura (ChatGPT). Vazio = desligado. Preenchido por ./oauth-chatgpt.sh.
      TORRE_OAUTH_ISSUER: "${TORRE_OAUTH_ISSUER:-}"
      TORRE_MCP_RESOURCE_URL: "${TORRE_MCP_RESOURCE_URL:-}"
      TORRE_OAUTH_PRIVATE_KEY: "${TORRE_OAUTH_PRIVATE_KEY:-}"     # só a API assina tokens
      TORRE_OAUTH_LOGINS_PILOTO: "${TORRE_OAUTH_LOGINS_PILOTO:-}" # piloto: só estes logins; vazio = liberado
      TORRE_OAUTH_REDIRECT_URIS: "${TORRE_OAUTH_REDIRECT_URIS:-https://chatgpt.com/connector_platform_oauth_redirect,https://chatgpt.com/connector/oauth/}"
    volumes:
      - ..:/srv/site:ro                 # páginas e dados do checkout (lista fechada em server/app/site.py)
    mem_limit: 256m
    cpus: 0.5
    logging: *logs
    networks:
      interno:
      proxy_edge:
        aliases: [torre-api]            # nome usado no Caddyfile do RadarDispensa

  # Enquanto as rotinas ainda rodam no GitHub Actions (Fase 1), traz os dados novos do repositório a cada 10 min.
  atualiza-dados:
    image: alpine:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache -q git openssh-client
        git config --global --add safe.directory /repo
        while true; do
          git -C /repo pull --ff-only -q || echo "$$(date -Iseconds) git pull falhou"
          sleep 600
        done
    volumes:
      - ..:/repo
      - ./ssh:/root/.ssh:ro             # chave de deploy (só leitura no GitHub) quando o repositório ficar privado
    mem_limit: 64m
    cpus: 0.2
    logging: *logs
    networks: [saida]

  # MCP somente leitura para o Codex e o ChatGPT (perfil "mcp": sobe depois de ./mcp-token.sh ou ./oauth-chatgpt.sh).
  # Sem banco, sem credencial de escrita: lê as bases do volume :ro e só verifica tokens (chave pública).
  mcp:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: mcp_torre/Dockerfile
    image: torre-mcp:local
    restart: unless-stopped
    environment:
      TORRE_MCP_SITE_ROOT: /srv/site
      TORRE_MCP_TOKENS_SHA256: "${TORRE_MCP_TOKENS_SHA256:-}"
      TORRE_MCP_HOSTS: "${TORRE_MCP_HOSTS:-mcp.2-25-95-244.sslip.io,torre-mcp:8000}"
      TORRE_MCP_RESOURCE_URL: "${TORRE_MCP_RESOURCE_URL:-}"
      TORRE_OAUTH_ISSUER: "${TORRE_OAUTH_ISSUER:-}"
      TORRE_OAUTH_PUBLIC_KEY: "${TORRE_OAUTH_PUBLIC_KEY:-}"       # só verifica; não emite token
      TORRE_MCP_PAINEL_URL: "${TORRE_OAUTH_ISSUER:-}"             # link de citação nos resultados de search
    volumes:
      - ..:/srv/site:ro                 # mesmas bases que a Torre exibe; nada é gravado
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.4
    logging: *logs
    networks:
      proxy_edge:
        aliases: [torre-mcp]            # nome usado no Caddyfile do RadarDispensa

volumes:
  torre_pg:

networks:
  interno:
    internal: true                      # Postgres sem saída para a internet e sem porta no host
  saida:
  proxy_edge:
    name: proxy_edge
    external: true                      # criada pelo instalar.sh (ou pelo RadarDispensa)
