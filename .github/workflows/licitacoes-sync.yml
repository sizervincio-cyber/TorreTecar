name: Licitações PNCP

on:
  schedule:
    # A cada 3 horas (UTC). Cada execução pega o que mudou no PNCP e avança o histórico desde 01/2021.
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Orçamento de tempo da coleta (minutos)"
        default: "45"

concurrency:
  group: licitacoes-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-assobens.txt

      - name: Instalar dependências
        run: pip install openpyxl pytest tzdata

      - name: Testes
        run: python -m pytest -q tests/test_licitacoes.py

      - name: Coletar PNCP
        run: python -m licitacoes sync --minutos "${{ inputs.minutos || '45' }}"

      - name: Versionar dados
        if: success()
        run: |
          git config user.name "licitacoes-bot"
          git config user.email "licitacoes-bot@users.noreply.github.com"
          git add "Analityc share/licitacoes"
          git diff --cached --quiet && exit 0
          git commit -m "data: licitações PNCP $(date +'%d/%m/%Y %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
