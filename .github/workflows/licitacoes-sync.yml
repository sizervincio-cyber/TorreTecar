name: Licitações PNCP

on:
  schedule:
    # De hora em hora (UTC). Cada execução pega o que mudou no PNCP, busca os órgãos que emplacaram na região e
    # avança o histórico desde 01/2021 (PNCP e Compras.gov.br). Execuções não se sobrepõem (concurrency).
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Orçamento de tempo da coleta (minutos)"
        default: "50"

concurrency:
  group: licitacoes-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          # rodada que esperou na fila parte da versão mais recente (não do commit de quando foi disparada)
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-assobens.txt

      - name: Instalar dependências
        run: pip install openpyxl pytest tzdata

      - name: Testes
        run: python -m pytest -q tests/test_licitacoes.py

      - name: Coletar PNCP
        run: python -m licitacoes sync --minutos "${{ inputs.minutos || '50' }}"

      - name: Versionar dados
        if: success()
        run: |
          git config user.name "licitacoes-bot"
          git config user.email "licitacoes-bot@users.noreply.github.com"
          # Só esta rotina escreve em "Analityc share/licitacoes" e as rodadas não se sobrepõem (concurrency):
          # a base desta rodada é a mais nova. Grava sobre o main mais recente trocando SÓ essa pasta, sem rebase
          # (o rebase dos JSON gerava conflito e perdia a rodada inteira) e sem desfazer outros commits.
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            git add "Analityc share/licitacoes"
            git diff --cached --quiet && exit 0
            git commit -q -m "data: licitações $(date +'%d/%m/%Y %H:%M') [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
