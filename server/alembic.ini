[alembic]
script_location = %(here)s/migrations
# Raiz do repositório (diretório de trabalho do contêiner) no sys.path, para o env.py importar server.app.
prepend_sys_path = .
# A URL vem de DATABASE_URL (ver migrations/env.py).

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
